<!DOCTYPE html>
<html lang="en" dir="ltr">
<!-- head -->
<include-head />

<body class="bg-neutral2 dark:bg-neutral12 duration-500">

    <include-theme-function />

    <!-- cursor -->
    <include-cursor />

    <!-- main start -->
    <main class="relative grid grid-cols-12 xl:gap-2">
        <!-- menu list area -->
        <include-menu-area-v3 />

        <!-- profile area -->
        <include-profile-area-v3 />

        <!-- about details area -->
        <div class="col-span-12 xl:col-span-8 xxxl:col-span-7 p-2 ltr:xl:pl-0 rtl:xl:pr-0">
            <!-- about section -->
            <section class="about-section bg-light dark:bg-dark rounded-lg xl:p-8 lg:p-6 p-4 pb-10">

                <!-- page content -->
                <div class="grid md:grid-cols-3 xs:grid-cols-2 grid-cols-1 gap-6">
                    <div class="col-span-1 flex flex-col items-center justify-center lg:gap-5 gap-3 xxl:p-8 xl:p-6 lg:p-5 md:p-4 p-3 bg-neutral2 dark:bg-neutral11 rounded-xl"
                        data-aos="fade-up">
                        <span
                            class="xl:size-15 lg:size-12 md:size-10 size-9 rounded-full bg-neutral1 dark:bg-accent2/20 flex items-center justify-center xl:text-2xl lg:text-xl text-lg text-accent2">
                            <i class="hgi-stroke hgi-call-02"></i>
                        </span>
                        <div class="flex flex-col gap-1 text-center">
                            <h4 class="text-dark dark:text-light">Phone</h4>
                            <span class="text-neutral11 dark:text-neutral2 font-normal lg:text-lg text-base">+1 234 567
                                890</span>
                        </div>
                    </div>

                    <div class="col-span-1 flex flex-col items-center justify-center lg:gap-5 gap-3 xxl:p-8 xl:p-6 lg:p-5 md:p-4 p-3 bg-neutral2 dark:bg-neutral11 rounded-xl"
                        data-aos="fade-up">
                        <span
                            class="xl:size-15 lg:size-12 md:size-10 size-9 rounded-full bg-neutral1 dark:bg-accent2/20 flex items-center justify-center xl:text-2xl lg:text-xl text-lg text-accent2">
                            <i class="hgi-stroke hgi-navigation-03"></i>
                        </span>
                        <div class="flex flex-col gap-1 text-center">
                            <h4 class="text-dark dark:text-light">Email</h4>
                            <span
                                class="text-neutral11 dark:text-neutral2 font-normal lg:text-lg text-base">tanya@exple.com</span>
                        </div>
                    </div>

                    <div class="col-span-1 flex flex-col items-center justify-center lg:gap-5 gap-3 xxl:p-8 xl:p-6 lg:p-5 md:p-4 p-3 bg-neutral2 dark:bg-neutral11 rounded-xl"
                        data-aos="fade-up">
                        <span
                            class="xl:size-15 lg:size-12 md:size-10 size-9 rounded-full bg-neutral1 dark:bg-accent2/20 flex items-center justify-center xl:text-2xl lg:text-xl text-lg text-accent2">
                            <i class="hgi-stroke hgi-location-01"></i>
                        </span>
                        <div class="flex flex-col gap-1 text-center">
                            <h4 class="text-dark dark:text-light">Address</h4>
                            <span class="text-neutral11 dark:text-neutral2 font-normal lg:text-lg text-base">775 Rolling
                                Green Rd.</span>
                        </div>
                    </div>
                </div>

                <!-- svg line animation 2 -->
                <include-svg-line-animation-2 />

                <!-- contact section -->
                <include-contact-v3 />

                <!-- footer section -->
                <include-footer-v3 />

            </section>
        </div>
    </main>
    <!-- main end -->

    <!-- footer section -->
</body>

</html>
